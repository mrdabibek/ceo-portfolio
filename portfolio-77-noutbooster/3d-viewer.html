<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chevrolet Cobalt - 3D Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, sans-serif; background:#e8e9eb; overflow:hidden; }
  #c { display:block; width:100vw; height:100vh; }
  .ui { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; z-index:10; }
  .ui button { padding:10px 16px; border:none; border-radius:10px; background:#111; color:#fff; cursor:pointer; font-size:14px; opacity:.9; }
  .ui button:hover { opacity:1; }
  .ui button.active { background:#c9a227; color:#111; }
  .ui a.dl { padding:10px 16px; border-radius:10px; background:#c9a227; color:#111; font-size:14px; text-decoration:none; font-weight:bold; }
  .title { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); color:#fff; padding:8px 18px; border-radius:10px; font-size:15px; z-index:10; }
  .hint { position:fixed; top:60px; left:50%; transform:translateX(-50%); color:#555; font-size:13px; z-index:10; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="title">Chevrolet Cobalt — oq sedan | Interaktiv 3D</div>
<div class="hint">Sichqoncha bilan aylantiring | g'ildirak — zoom</div>
<canvas id="c"></canvas>
<div class="ui">
  <button data-view="front" class="active">FRONT VIEW</button>
  <button data-view="rear">REAR VIEW</button>
  <button data-view="left">LEFT SIDE</button>
  <button data-view="right">RIGHT SIDE</button>
  <button data-view="top">TOP</button>
  <button id="spin">⟳ Auto</button>
  <a class="dl" href="cobalt.glb" download>⬇ GLB yuklash</a>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e9eb);
scene.fog = new THREE.Fog(0xe8e9eb, 18, 40);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.8, 7.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.minDistance = 3.5;
controls.maxDistance = 14;

// Lights — studiya
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a6, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdde7ff, 0.7);
fill.position.set(-6, 4, -5);
scene.add(fill);

// Pol — aylana platforma (rasmdagidek)
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color:0xf2f3f5, roughness:0.25, metalness:0.1 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);
const ring = new THREE.Mesh(
  new THREE.RingGeometry(3.6, 3.65, 80),
  new THREE.MeshBasicMaterial({ color:0xb9bec6, transparent:true, opacity:0.6, side:THREE.DoubleSide })
);
ring.rotation.x = -Math.PI/2; ring.position.y = 0.01;
scene.add(ring);

// Materiallar
const paint = new THREE.MeshStandardMaterial({ color:0xf7f7f5, roughness:0.35, metalness:0.15 });
const paintDark = new THREE.MeshStandardMaterial({ color:0xe9e9e7, roughness:0.5, metalness:0.1 });
const glass = new THREE.MeshStandardMaterial({ color:0x1a2733, roughness:0.05, metalness:0.9 });
const glassSide = new THREE.MeshStandardMaterial({ color:0x2a3d4d, roughness:0.08, metalness:0.7 });
const black = new THREE.MeshStandardMaterial({ color:0x141414, roughness:0.8 });
const grilleMat = new THREE.MeshStandardMaterial({ color:0x1c1c1c, roughness:0.6 });
const chrome = new THREE.MeshStandardMaterial({ color:0xd8d8d8, roughness:0.2, metalness:0.9 });
const headMat = new THREE.MeshStandardMaterial({ color:0xe8eef2, roughness:0.1, metalness:0.4, emissive:0x44484c, emissiveIntensity:0.25 });
const tailMat = new THREE.MeshStandardMaterial({ color:0xb81f24, roughness:0.3, emissive:0x550000, emissiveIntensity:0.4 });
const gold = new THREE.MeshStandardMaterial({ color:0xc9a227, roughness:0.3, metalness:0.8 });
const tyre = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 });
const rim = new THREE.MeshStandardMaterial({ color:0xcfd2d6, roughness:0.3, metalness:0.8 });

const car = new THREE.Group();
scene.add(car);
function box(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = true; m.receiveShadow = true;
  car.add(m); return m;
}

// Kuzov — pastki asosiy hajm (Cobalt sedan proporsiyasi: uzun ~4.47m)
box(1.78, 0.62, 4.45, paint, 0, 0.72, 0);                    // asosiy korpus
box(1.70, 0.28, 4.0, paint, 0, 0.42, 0);                     // pastki etak
// Kapot / bagaj qiyaligi
const hood = box(1.66, 0.14, 1.15, paint, 0, 1.02, 1.62, -0.08, 0, 0);
const trunk = box(1.64, 0.14, 0.9, paint, 0, 1.03, -1.75, 0.07, 0, 0);
// Salon — kabina
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.55, 2.2), paint);
cabin.position.set(0, 1.28, -0.2); cabin.castShadow = true;
car.add(cabin);
// Old oyna + orqa oyna (qiya)
box(1.4, 0.5, 0.06, glass, 0, 1.28, 0.95, -0.42, 0, 0);
box(1.4, 0.45, 0.06, glass, 0, 1.28, -1.32, 0.42, 0, 0);
// Yon oynalar
box(0.04, 0.38, 2.05, glassSide, 0.77, 1.28, -0.2);
box(0.04, 0.38, 2.05, glassSide, -0.77, 1.28, -0.2);
// Tom
box(1.54, 0.08, 1.25, paint, 0, 1.58, -0.2);
// Ustunlar
[[-0.72,0.9],[0.72,0.9],[-0.72,-1.25],[0.72,-1.25]].forEach(([x,z])=>box(0.09,0.55,0.09,paint,x,1.28,z));

// OLD (front, +Z): panjara, faralar, bamper, nomer
box(1.0, 0.10, 0.06, chrome, 0, 1.0, 2.235);                 // xrom chiziq
box(0.9, 0.16, 0.06, grilleMat, 0, 0.82, 2.235);             // katta panjara
box(0.34, 0.07, 0.05, gold, 0, 0.92, 2.26);                  // Chevy krest (soddalashgan)
box(0.06, 0.12, 0.04, gold, 0, 0.92, 2.265);
box(0.42, 0.26, 0.1, headMat, 0.62, 0.95, 2.2, 0, 0.15, 0);  // o'ng fara
box(0.42, 0.26, 0.1, headMat, -0.62, 0.95, 2.2, 0, -0.15, 0);// chap fara
box(0.16, 0.12, 0.06, headMat, 0.68, 0.55, 2.24);            // tumanka o'ng
box(0.16, 0.12, 0.06, headMat, -0.68, 0.55, 2.24);           // tumanka chap
box(0.7, 0.08, 0.05, grilleMat, 0, 0.42, 2.24);              // pastki panjara
box(0.52, 0.16, 0.02, new THREE.MeshStandardMaterial({color:0xffffff}), 0, 0.55, 2.27); // CHEVROLET nomer
// ORQA (rear, -Z): stoplar, bagaj chizig'i, COBALT nomer
box(0.32, 0.34, 0.08, tailMat, 0.72, 0.9, -2.24);
box(0.32, 0.34, 0.08, tailMat, -0.72, 0.9, -2.24);
box(0.2, 0.06, 0.04, gold, 0, 1.05, -2.26);                  // orqa logo
box(0.52, 0.16, 0.02, new THREE.MeshStandardMaterial({color:0xffffff}), 0, 0.55, -2.27); // COBALT nomer
box(1.78, 0.22, 0.15, paintDark, 0, 0.38, -2.2);             // orqa bamper

// Yon detallar: tutqichlar, molding, antenna, ko'zgular
[0.9,-0.9].forEach(z=>{
  box(0.03, 0.05, 0.28, chrome, 0.9, 0.85, z);
  box(0.03, 0.05, 0.28, chrome, -0.9, 0.85, z);
});
box(1.8, 0.06, 4.0, paintDark, 0, 0.32, 0);                 // yon etak
const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.02,0.35), black);
ant.position.set(0.3, 1.8, -0.3); ant.rotation.x = 0.2; car.add(ant);
box(0.22, 0.1, 0.14, paint, 0.95, 1.15, 0.75);               // o'ng ko'zgu
box(0.22, 0.1, 0.14, paint, -0.95, 1.15, 0.75);              // chap ko'zgu

// G'ildiraklar — 4 dona, 5 спицali disk
function wheel(x, z){
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 32), tyre);
  t.rotation.z = Math.PI/2; t.castShadow = true;
  g.add(t);
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.25, 16), rim);
  r.rotation.z = Math.PI/2;
  g.add(r);
  for(let i=0;i<5;i++){
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.04), new THREE.MeshStandardMaterial({color:0x8a8e93, metalness:0.7, roughness:0.4}));
    s.rotation.x = (i/5)*Math.PI*2;
    g.add(s);
  }
  g.position.set(x, 0.34, z);
  car.add(g);
}
wheel(0.82, 1.45); wheel(-0.82, 1.45); wheel(0.82, -1.45); wheel(-0.82, -1.45);

// GLB model (cobalt.glb) — topilsa prosedural model o'rniga u ko'rsatiladi
let spinGroup = car;
new GLTFLoader().load('cobalt.glb', (gltf)=>{
  car.visible = false;
  const model = gltf.scene;
  model.traverse((o)=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  scene.add(model);
  spinGroup = model;
}, undefined, ()=>{ /* topilmasa prosedural model qoladi */ });

// Kamera pozitsiyalari — 4 taraf (rasmdagidek)
const views = {
  front: [0, 1.1, 7.2],
  rear: [3.4, 1.4, -5.6],
  left: [-7.0, 1.1, 0.4],
  right: [7.0, 1.1, 0.4],
  top: [0, 9, 0.5]
};
let auto = false;
document.querySelectorAll('[data-view]').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const p = views[b.dataset.view];
    camera.position.set(...p);
    controls.target.set(0, 0.7, 0);
  };
});
document.getElementById('spin').onclick = (e)=>{
  auto = !auto;
  e.target.classList.toggle('active', auto);
  e.target.textContent = auto ? '⏸ Stop' : '⟳ Auto';
};

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop(){
  requestAnimationFrame(loop);
  if(auto) spinGroup.rotation.y += 0.01;
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
